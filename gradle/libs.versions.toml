# Every version the build uses, once. docs/toolchain.md records why each one is the version it is.

[versions]
# Build
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
realm = "10.19.0"
navigation = "2.9.8"
compileSdk = "37"
targetSdk = "36"
minSdk = "23"
ndk = "29.0.14206865"
cmake = "3.22.1"
jvmTarget = "11"

# Libraries
androidxCore = "1.19.1"
appcompat = "1.8.0"
activity = "1.12.4"
fragment = "1.9.1"
material = "1.14.0"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
swiperefreshlayout = "1.2.0"
viewpager = "1.1.0"
documentfile = "1.1.0"
lifecycle = "2.11.0"
preference = "1.2.1"
coroutines = "1.11.0"
mina = "2.2.10"
ftpserver = "1.2.1"
glide = "5.0.9"
koin = "4.2.2"
rootTools = "5.0"

# Quality tools
detekt = "1.23.8"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"

# Test libraries
junit = "4.13.2"
robolectric = "4.17"
archCoreTesting = "2.2.0"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-runtime-ktx = { module = "androidx.navigation:navigation-runtime-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "viewpager" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
mina-core = { module = "org.apache.mina:mina-core", version.ref = "mina" }
ftpserver-ftplet-api = { module = "org.apache.ftpserver:ftplet-api", version.ref = "ftpserver" }
ftpserver-core = { module = "org.apache.ftpserver:ftpserver-core", version.ref = "ftpserver" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-ksp = { module = "com.github.bumptech.glide:ksp", version.ref = "glide" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
roottools = { module = "com.github.Stericson:RootTools", version.ref = "rootTools" }
realm-annotations-processor = { module = "io.realm:realm-annotations-processor", version.ref = "realm" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "archCoreTesting" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Realm publishes no plugin marker; settings.gradle.kts maps this id to io.realm:realm-gradle-plugin.
realm = { id = "realm-android", version.ref = "realm" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
