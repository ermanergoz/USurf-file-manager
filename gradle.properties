org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Every dependency is on AndroidX already (./gradlew checkJetifier), so nothing is rewritten at build time.
android.enableJetifier=false
kotlin.code.style=official
# Realm 10.19.0, the last Realm Java, finds Kotlin through the Kotlin Android plugin and reads the Android plugin through
# its classic extension, so the build keeps both instead of the Android plugin's own Kotlin and newer DSL.
android.builtInKotlin=false
android.newDsl=false
# The Check runs the unit tests of the release build as well as of the debug build.
android.onlyEnableUnitTestForTheTestedBuildType=false
