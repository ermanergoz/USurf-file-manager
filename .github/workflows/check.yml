name: Check

on:
  pull_request:
    branches:
      - develop
      - master
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, static analysis and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code and the 7-Zip sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK and CMake the native build uses
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      - name: Run lint, detekt and ktlint, and build the debug app for every ABI
        run: ./gradlew --no-daemon lint detekt ktlintCheck assembleDebug
