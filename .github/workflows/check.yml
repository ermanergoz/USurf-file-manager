name: Check

on:
  pull_request:
    branches:
      - develop
      - master
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, static analysis and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code and the 7-Zip sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source cache kept in GitHub's own Actions cache, not the action's commercial caching service.
          cache-provider: basic

      - name: Install the NDK and CMake the native build uses
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - name: Run lint, detekt and ktlint, and build the debug app for every ABI
        run: ./gradlew --no-daemon lint detekt ktlintCheck assembleDebug
