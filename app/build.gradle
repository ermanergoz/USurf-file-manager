    implementation group: 'org.apache.ftpserver', name: 'ftplet-api', version: '1.2.1'
    implementation group: 'org.apache.ftpserver', name: 'ftpserver-core', version: '1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation('com.github.Stericson:RootTools:5.0') { transitive = false }
